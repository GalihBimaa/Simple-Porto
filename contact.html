<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Kontak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Porto<span>.</span></a>
            <nav>
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="About.html">About</a></li>
                    <li><a href="Projects.html">Proyek</a></li>
                    <li><a href="Contact.html">Kontak</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="fade-in">
            <h2>Mari Berdiskusi</h2>
            <p>Tertarik untuk bekerja sama atau sekadar berbincang? Jangan ragu untuk menghubungi saya.</p>
        </div>

        <section class="fade-in" style="margin-top: 2rem;">
            <div class="contact-form">
                <form action="#" onsubmit="event.preventDefault(); alert('Terima kasih! Pesan profesional Anda telah direkam oleh sistem.');">
                    <div class="form-group">
                        <label for="name">Nama Lengkap</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Alamat Email</label>
                        <input type="email" id="email" placeholder="email@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Pesan Anda</label>
                        <textarea id="message" rows="5" placeholder="Tuliskan detail diskusi di sini..." required></textarea>
                    </div>
                    <button type="submit" class="btn" style="cursor: pointer; background: var(--text-primary); color: var(--bg-main);">Kirim Pesan</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hak Cipta Dilindungi. Didesain oleh Profesional.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
